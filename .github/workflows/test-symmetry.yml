name: Test NDR Symmetry

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Run symmetry tests
    runs-on: ubuntu-latest
    # matbox resolves and downloads its MATLAB dependencies (e.g.
    # vhlab-toolbox-matlab) through the GitHub API. Give it the runner's built-in
    # token (auto-provided; no secret to configure) so those calls are
    # authenticated (5000 req/hr) instead of hitting the shared unauthenticated
    # limit (60 req/hr), which was intermittently failing dependency install.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Coverage from this job is uploaded to Codecov (flag "symmetry") and
      # merged with the general test job's (flag "unittests"); see codecov.yml.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Start virtual display server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true
          products: |
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Run symmetry tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            % Add the repo root so MATLAB sees the top-level +ndr namespace,
            % and add tools/tests so MATLAB sees the +ndr/+symmetry namespace.
            % Note: MATLAB namespace (+foo) directories must NOT appear on the
            % path themselves; only their parent directories should.
            addpath(pwd);
            addpath(fullfile(pwd, "tools", "tests"));

            % Install MATLAB dependencies declared in tools/requirements.txt
            % (e.g. vhlab-toolbox-matlab, which provides vlt.string.*).
            matbox.installRequirements(fullfile(pwd, "tools"));

            % Skip ndr_Init -- it tries to mkdir filecache paths under
            % userpath which are not writable on the CI runner, and the
            % symmetry tests only use ndr.fun.ndrpath() which is self-contained.

            import matlab.unittest.TestSuite
            import matlab.unittest.TestRunner
            import matlab.unittest.plugins.CodeCoveragePlugin
            import matlab.unittest.plugins.codecoverage.CoberturaFormat

            makeSuite = TestSuite.fromPackage("ndr.symmetry.makeArtifacts", "IncludingSubpackages", true);
            readSuite = TestSuite.fromPackage("ndr.symmetry.readArtifacts", "IncludingSubpackages", true);

            % Python never runs in this workflow, so the pythonArtifacts cases
            % cannot run here by design. Deselect them by name rather than let
            % them come back Incomplete, so that every Incomplete result below
            % is a comparison that SHOULD have run (VH-Lab/NDR-python#34).
            % NDR-python's test-symmetry.yml runs them against real Python
            % artifacts.
            isPython = contains({readSuite.Name}, "SourceType=pythonArtifacts");
            fprintf("\nDeselected (no Python in this workflow): %d pythonArtifacts case(s)\n", nnz(isPython));
            readSuite = readSuite(~isPython);
            suite = [makeSuite, readSuite];

            fprintf("\n=== Discovered %d test(s) ===\n", numel(suite));
            for k = 1:numel(suite)
                fprintf("  %d. %s\n", k, suite(k).Name);
            end
            fprintf("\n");
            assert(~isempty(suite), "No symmetry tests were found. Check tools/tests/+ndr/+symmetry.")

            runner = TestRunner.withTextOutput("Verbosity", "Detailed");

            % Measure coverage of the same +ndr files the general test job
            % measures (matbox.tasks.testToolbox), so Codecov can merge the two
            % reports into one figure. The symmetry tests are excluded from the
            % general job, and they are the only tests that reach some reader
            % and format code.
            mfiles = dir(fullfile(pwd, "+ndr", "**", "*.m"));
            coverageFiles = fullfile({mfiles.folder}, {mfiles.name});
            runner.addPlugin(CodeCoveragePlugin.forFile(coverageFiles, ...
                "Producing", CoberturaFormat(fullfile(pwd, "symmetry-coverage.xml"))));

            nMake = numel(makeSuite);
            nRead = numel(readSuite);

            % ONE run, make cases first and then read cases (a suite runs in
            % order): a coverage plugin writes its report at the end of each
            % run, so two runs would leave only the second one's coverage.
            allResults = runner.run(suite);
            makeResults = allResults(1:nMake);
            readResults = allResults(nMake+1:end);

            fprintf("\n=== makeArtifacts Results: %d passed, %d failed, %d incomplete out of %d ===\n", ...
                nnz([makeResults.Passed]), nnz([makeResults.Failed]), nnz([makeResults.Incomplete]), nMake);

            fprintf("\n=== readArtifacts Results: %d passed, %d failed, %d incomplete out of %d ===\n", ...
                nnz([readResults.Passed]), nnz([readResults.Failed]), nnz([readResults.Incomplete]), nRead);

            results = [makeResults, readResults];
            fprintf("\n=== Overall Symmetry Test Results ===\n");
            fprintf("  %d passed, %d failed, %d incomplete out of %d total\n", ...
                nnz([results.Passed]), nnz([results.Failed]), nnz([results.Incomplete]), numel(results));
            disp(table(results));

            assert(all(~[results.Failed]), "Some symmetry tests failed")

            % An Incomplete test is one whose comparison did not run: missing
            % artifacts, a missing example file, a missing tool. Every case
            % left in this suite is expected to run here, so Incomplete is a
            % failure, not a courtesy (VH-Lab/NDR-python#34).
            incomplete = results([results.Incomplete]);
            for k = 1:numel(incomplete)
                fprintf(2, "INCOMPLETE: %s\n", incomplete(k).Name);
            end
            assert(isempty(incomplete), ...
                "%d symmetry test(s) were Incomplete: their comparison did not run. See the INCOMPLETE lines above.", ...
                numel(incomplete))

      - name: Upload symmetry coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: symmetry-coverage.xml
          flags: symmetry

      - name: Restore MATLAB Path
        uses: matlab-actions/run-command@v3
        if: always()
        with:
          command: |
            restoredefaultpath()
            savepath()
